name: Build FFEX IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH=""
          for ver in Xcode_16.3 Xcode_16.2 Xcode_16.1 Xcode_16; do
            if [ -d "/Applications/${ver}.app" ]; then
              XCODE_PATH="/Applications/${ver}.app"
              break
            fi
          done
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(xcode-select -p | sed 's|/Contents/Developer||')
          fi
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "${XCODE_PATH}/Contents/Developer"
          xcodebuild -version

      - name: Verify repo structure
        run: |
          echo "=== Repo structure ==="
          find "$GITHUB_WORKSPACE" -name "*.xcodeproj" -maxdepth 4
          find "$GITHUB_WORKSPACE" -name "*.swift" -maxdepth 6 | sort

      - name: Resolve project path
        id: paths
        run: |
          PROJ=$(find "$GITHUB_WORKSPACE" -name "FFEX.xcodeproj" -maxdepth 4 | head -1)
          PROJ_DIR=$(dirname "$PROJ")
          echo "PROJ=$PROJ"         >> $GITHUB_OUTPUT
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_OUTPUT
          echo "Project: $PROJ"

      - name: Validate pbxproj file references
        run: |
          PBXPROJ="${{ steps.paths.outputs.PROJ }}/project.pbxproj"
          for entry in \
            "App.swift" "Utils.swift" "SBX.swift" "MG.swift" \
            "KernelExploit.swift" "SupportPolicy.swift" "ContainerStore.swift" \
            "Localization.swift" "LicenseService.swift" "FFInjectService.swift" \
            "ContainerIdentityResolver.swift" "StringObfuscator.swift" \
            "AntiDebug.swift" "SessionStore.swift" \
            "LanguagePickerView.swift" "LoginView.swift" "MainMenuView.swift" \
            "bad_query.c" "mcm_bridge.m" "kexploit_opa334.m" \
            "offsets.m" "krw.m" "kutils.m" "vnode.m" \
            "sandbox_escape.m" "wallpaper_zip.c"; do
            if grep -q "$entry" "$PBXPROJ"; then
              echo "  OK $entry"
            else
              echo "  MISSING: $entry"
              exit 1
            fi
          done
          echo "All file references present."

      - name: List schemes
        run: |
          cd "${{ steps.paths.outputs.PROJ_DIR }}"
          xcodebuild -project FFEX.xcodeproj -list 2>&1 || true

      - name: Build (unsigned, iphoneos arm64 only)
        run: |
          set -o pipefail
          cd "${{ steps.paths.outputs.PROJ_DIR }}"
          BUILD_OUT="$RUNNER_TEMP/build_output"

          xcodebuild build \
            -project FFEX.xcodeproj \
            -scheme FFEX \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            VALID_ARCHS=arm64 \
            SDKROOT=iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_BITCODE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            SWIFT_COMPILATION_MODE=wholemodule \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            ENABLE_TESTABILITY=NO \
            DEAD_CODE_STRIPPING=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            COPY_PHASE_STRIP=YES \
            GCC_SYMBOLS_PRIVATE_EXTERN=YES \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES \
            CONFIGURATION_BUILD_DIR="$BUILD_OUT" \
            2>&1 | tee /tmp/xcodebuild.log

          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "=== BUILD FAILED — last 400 lines ==="
            tail -400 /tmp/xcodebuild.log
            exit $BUILD_EXIT
          fi
          echo "BUILD_OUT=$BUILD_OUT" >> $GITHUB_ENV

      - name: Show build log on failure
        if: failure()
        run: tail -500 /tmp/xcodebuild.log || true

      - name: Package IPA
        run: |
          BUILD_OUT="${BUILD_OUT:-$RUNNER_TEMP/build_output}"
          APP_PATH=$(find "$BUILD_OUT" -name "FFEX.app" -maxdepth 4 | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "FFEX.app" -not -path "*.dSYM/*" | head -1)
          fi
          echo "App: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: FFEX.app not found"
            find "$RUNNER_TEMP" -name "*.app" 2>/dev/null | head -10
            exit 1
          fi

          IPA_STAGING="$RUNNER_TEMP/IPAStaging/Payload"
          mkdir -p "$IPA_STAGING"
          cp -R "$APP_PATH" "$IPA_STAGING/"
          cd "$RUNNER_TEMP/IPAStaging"
          zip -r "$RUNNER_TEMP/FFEX.ipa" Payload/
          echo "IPA size: $(du -sh "$RUNNER_TEMP/FFEX.ipa" | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FFEX-${{ github.run_number }}
          path: ${{ runner.temp }}/FFEX.ipa
          retention-days: 30
          if-no-files-found: error
